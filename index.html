<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ruleta del Premio Mayor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --sun:#ffe45c;
  --sun2:#ffcf33;
  --pink:#ff4fa3;
  --pink-deep:#c2186b;
  --mint:#23c9b0;
  --orange:#ff8a1f;
  --violet:#7b4dff;
  --ink:#2b1233;
  --muted:#6a4a70;
  /* institucionales (solo ruleta) */
  --es-azul:#0078BA;
  --es-celeste:#3DB7E4;
  --es-marino:#00507f;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --body:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--body);font-size:18px;
  background-color:var(--sun);
  background-image:
    radial-gradient(circle at 12% 18%, var(--pink) 0 6px, transparent 7px),
    radial-gradient(circle at 78% 8%, var(--mint) 0 5px, transparent 6px),
    radial-gradient(circle at 88% 62%, var(--violet) 0 6px, transparent 7px),
    radial-gradient(circle at 30% 80%, var(--orange) 0 5px, transparent 6px),
    radial-gradient(circle at 55% 40%, var(--pink) 0 4px, transparent 5px),
    linear-gradient(160deg,#fff27a 0%, var(--sun) 45%, #ffd23f 100%);
  background-size:220px 220px,260px 260px,240px 240px,200px 200px,180px 180px,100% 100%;
  background-attachment:fixed;
  padding-inline:16px;padding-block:20px 40px;
}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:22px}

/* Rótulo */
.marquee{
  position:relative;width:100%;box-sizing:border-box;text-align:center;
  background:linear-gradient(135deg,var(--pink) 0%,#ff6f7d 50%,var(--orange) 100%);
  border:4px solid #fff;border-radius:20px;padding:26px 22px 24px;
  box-shadow:0 0 0 5px var(--pink-deep),0 16px 36px rgba(194,24,107,.35);
}
.bulbs{position:absolute;inset:6px;pointer-events:none}
.bulbs i{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff7b0;box-shadow:0 0 10px #fff27a;animation:blink 1.1s infinite}
.bulbs i:nth-child(even){animation-delay:.55s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.eyebrow{font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#fff7b0;font-size:15px;margin:0 0 6px}
h1{font-family:var(--display);font-weight:400;margin:0;color:#fff;
  font-size:clamp(28px,7vw,56px);line-height:1.02;text-wrap:balance;
  text-shadow:0 3px 0 var(--pink-deep),0 6px 0 #7a0d43}
.logo-top{position:absolute;right:14px;top:14px;width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.logo-top img{width:80%;height:80%;object-fit:contain}

/* Escenario */
.stage{width:100%;display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:20px;align-items:center}
.host{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.bubble{
  position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;
  padding:12px 14px;font-weight:700;font-size:19px;line-height:1.2;text-align:center;
  box-shadow:4px 4px 0 var(--ink);min-height:48px;display:grid;place-items:center;width:100%;box-sizing:border-box
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
  border-left:12px solid transparent;border-right:12px solid transparent;border-top:16px solid var(--ink)}
.bubble::before{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);z-index:1;
  border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #fff}
.host-card{position:relative;background:#fff;padding:8px 8px 34px;border-radius:6px;transform:rotate(-3deg);
  box-shadow:0 12px 28px rgba(43,18,51,.3);width:100%;box-sizing:border-box}
.host-card img{display:block;width:100%;border-radius:3px}
.host-card figcaption{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--display);font-size:15px;color:var(--pink-deep)}
.host.talking .host-card{animation:wiggle .35s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-4deg)}to{transform:rotate(-1deg) translateY(-3px)}}

.wheelbox{display:flex;flex-direction:column;align-items:center;gap:18px}
.stagewheel{position:relative;width:min(88vw,540px);aspect-ratio:1;max-width:100%}
#wheel{width:100%;height:100%;display:block;border-radius:50%;
  box-shadow:0 0 0 10px var(--es-azul),0 0 0 17px var(--es-celeste),0 0 0 21px #fff,0 22px 50px rgba(0,80,127,.35)}
.pointer{position:absolute;left:50%;top:-20px;transform:translateX(-50%);z-index:2;width:0;height:0;
  border-left:22px solid transparent;border-right:22px solid transparent;border-top:46px solid var(--es-marino);
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30%;aspect-ratio:1;border-radius:50%;
  background:#fff;overflow:hidden;display:grid;place-items:center;
  box-shadow:0 0 0 6px var(--es-azul),0 0 0 10px var(--es-celeste),0 6px 16px rgba(0,0,0,.3);
  font-family:var(--display);color:var(--es-azul);font-size:clamp(14px,3.4vw,22px)}
.hub img{width:84%;height:84%;object-fit:contain}

.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
button{font-family:var(--display);cursor:pointer;border:none;border-radius:999px}
#spin{font-size:clamp(26px,6vw,36px);padding:14px 60px;letter-spacing:.06em;color:#fff;
  background:linear-gradient(180deg,#ff77b8,var(--pink));box-shadow:0 6px 0 var(--pink-deep),0 12px 24px rgba(194,24,107,.4);transition:transform .08s}
#spin:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-deep)}
#spin:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.opt{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:17px;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--pink)}

.result{width:100%;max-width:640px;box-sizing:border-box;text-align:center;background:#fff;
  border:3px solid var(--ink);border-radius:18px;padding:18px;box-shadow:6px 6px 0 var(--mint)}
.result .lbl{font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--pink-deep);font-size:14px}
.result .name{font-family:var(--display);font-size:clamp(24px,6vw,40px);margin:6px 0 4px;line-height:1.1;text-wrap:balance;color:var(--es-azul)}
.result .msg{color:var(--muted);font-size:18px}
.result.win{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
#download{margin-top:14px;font-size:18px;padding:12px 28px;background:var(--mint);color:#08372f;box-shadow:0 4px 0 #148c7a}
#download:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:15px;color:var(--muted);margin-top:8px;min-height:1em}
#preview{display:block;margin:12px auto 0;max-width:100%;border-radius:10px}

.list{width:100%;max-width:640px}
.list summary{cursor:pointer;color:var(--pink-deep);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:15px}
.list ol{columns:2;column-gap:24px;margin:10px 0 0;padding-left:28px;color:var(--muted);font-size:16px}
.list li.out{text-decoration:line-through;opacity:.5}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
@media (max-width:720px){
  .stage{grid-template-columns:1fr}
  .host{flex-direction:row;align-items:center;max-width:460px;margin:0 auto}
  .host-card{width:42%;flex:none;order:0}
  .bubble{order:1}
  .bubble::after{left:-16px;top:50%;bottom:auto;transform:translateY(-50%);border-top:12px solid transparent;border-bottom:12px solid transparent;border-right:16px solid var(--ink);border-left:0}
  .bubble::before{left:-10px;top:50%;bottom:auto;transform:translateY(-50%);border-top:9px solid transparent;border-bottom:9px solid transparent;border-right:12px solid #fff;border-left:0}
  .list ol{columns:1}
  .logo-top{width:48px;height:48px;right:10px;top:10px}
}
@media (prefers-reduced-motion:reduce){.bulbs i,.host.talking .host-card,.result.win{animation:none}}
</style>
</head>

<script>
const LOGO = ""; // data URI del logo (vacío = sin logo)
const ALL = [
"ACEVEDO ARIAS LUIS FERNANDO","ALVARADO CHAVEZ TULIO","ARAUJO ROJAS CARLOS W.","BUSTAMANTE MANRIQUE JOSE",
"CASANI ALBERTO JHOM","COLLAZOS PAJUELO RICARDO J.","CCOYO DAVILA JOSE LUIS","CRUZ HUAMAN LUIS",
"GUERRA GIRALDO RICARDO","HUAMAN RAMIREZ FIDEL","HUAMAN RAMIREZ SEGUNDO","KOC MENA ROBERTO CARLOS",
"LA TORRE FERNANDEZ EDWIN","MACEDO FASABI YEISSO FRAY","MORENO SOLANO JUAN","OLANO TARRILLO MIGUEL",
"ORMEÑO VALERA PABLO","OSPINA MARTNI JOEL","QUISPE TORREJON CARLOS E.","RAMIREZ PEÑA CRISTHIAN",
"RODRIGUEZ RAMOS RAUL R.","ROSALES CASALLO ERICSON","SOYER ALFARO NAIM","VILCHEZ RAFAEL JESUS"];
let names = ALL.slice();
const out = new Set();
const COLORS = ["#0078BA","#3DB7E4","#00507f","#ffffff"];
const TEXT = {"#0078BA":"#ffffff","#3DB7E4":"#0b2f4a","#00507f":"#ffffff","#ffffff":"#0078BA"};
const cv = document.getElementById('wheel'), ctx = cv.getContext('2d');
const R = cv.width/2;
let angle = 0, spinning = false, winner = null, photoBlob = null;
let logoImg = null;

if (LOGO) {
  logoImg = new Image(); logoImg.src = LOGO;
  const h=document.getElementById('hub'); h.textContent=''; const a=new Image(); a.src=LOGO; a.alt='Logo'; h.appendChild(a);
  const t=document.getElementById('logoTop'); const b=new Image(); b.src=LOGO; b.alt='Logo'; t.appendChild(b); t.hidden=false;
}

(function(){const b=document.getElementById('bulbs');const n=16;
 for(let i=0;i<n;i++){for(const pos of ['top','bottom']){const e=document.createElement('i');e.style.left=(i/(n-1)*100)+'%';e.style[pos]='-4px';e.style.transform='translateX(-50%)';b.appendChild(e);}}
 for(let i=1;i<3;i++){for(const pos of ['left','right']){const e=document.createElement('i');e.style.top=(i/3*100)+'%';e.style[pos]='-4px';b.appendChild(e);}}
})();

const bubble=document.getElementById('bubble'), host=document.getElementById('host');
const SPIN_LINES=["¡Gira, gira, gira!","¡Uy, uy, uy… ya casi!","¡Que no me vean nervioso!","¡Redoble de tambores!"];
function say(t){bubble.textContent=t;}

function renderList(){const ol=document.getElementById('plist');ol.innerHTML='';
  ALL.forEach(n=>{const li=document.createElement('li');li.textContent=n;if(out.has(n))li.className='out';ol.appendChild(li);});}
function colorFor(i,n){ let c = COLORS[i%4]; if(n%4===1 && i===n-1) c = COLORS[1]; return c; }

function draw(){
  const n = names.length, seg = Math.PI*2/n;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save(); ctx.translate(R,R); ctx.rotate(angle);
  for(let i=0;i<n;i++){
    const a0 = -Math.PI/2 + i*seg - seg/2;
    const c = colorFor(i,n);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-4,a0,a0+seg); ctx.closePath();
    ctx.fillStyle=c; ctx.fill();
    ctx.strokeStyle='rgba(0,80,127,.35)'; ctx.lineWidth=3; ctx.stroke();
    ctx.save(); ctx.rotate(a0+seg/2);
    ctx.fillStyle=TEXT[c]; ctx.textAlign='right'; ctx.textBaseline='middle';
    let fs = n>16?26:n>8?32:40;
    ctx.font = `700 ${fs}px "Barlow Condensed","Arial Narrow",sans-serif`;
    const maxW = R*0.58; const t = names[i];
    while(ctx.measureText(t).width>maxW && fs>14){fs--;ctx.font=`700 ${fs}px "Barlow Condensed","Arial Narrow",sans-serif`;}
    ctx.fillText(t, R-30, 0);
    ctx.restore();
  }
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*seg-seg/2;ctx.beginPath();ctx.arc(Math.cos(a)*(R-14),Math.sin(a)*(R-14),6,0,Math.PI*2);ctx.fillStyle='#3DB7E4';ctx.fill();}
  ctx.restore();
}

let ac=null;
function tick(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=900;
  g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.05);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.06);}catch(e){} }
function fanfare(){ try{ if(!ac) return; [523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
  const t=ac.currentTime+i*.14;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.5);}); }catch(e){} }
function rand(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}

function spin(){
  if(spinning||names.length<1) return;
  if(document.getElementById('remove').checked && winner && names.includes(winner) && names.length>1){
    out.add(winner); names=names.filter(n=>n!==winner); renderList(); draw();
  }
  spinning=true; document.getElementById('spin').disabled=true;
  document.getElementById('download').disabled=true; document.getElementById('preview').hidden=true;
  document.getElementById('note').textContent='';
  const res=document.getElementById('result'); res.classList.remove('win');
  document.getElementById('resLbl').textContent='Girando…';
  document.getElementById('resName').textContent='¿Quién será?';
  document.getElementById('resMsg').textContent='Redoble de tambores…';
  host.classList.add('talking'); let li=0; say(SPIN_LINES[0]);
  const talk=setInterval(()=>{li=(li+1)%SPIN_LINES.length;say(SPIN_LINES[li]);},1400);

  const n=names.length, seg=Math.PI*2/n;
  const pick=Math.floor(rand()*n);
  const jitter=(rand()-.5)*seg*0.7;
  const base = angle - (angle % (Math.PI*2));
  let target = base + 6*Math.PI*2 + (-(pick*seg) - jitter);
  while(target < angle + 5*Math.PI*2) target += Math.PI*2;
  const start=angle, dur=5200+rand()*1200, t0=performance.now();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let lastSeg = Math.floor((start+seg/2)/seg);
  function frame(now){
    const p=Math.min(1,(now-t0)/(reduce?600:dur));
    const e=1-Math.pow(1-p,4);
    angle = start + (target-start)*e;
    const s=Math.floor((angle+seg/2)/seg); if(s!==lastSeg){lastSeg=s;tick();}
    draw();
    if(p<1) requestAnimationFrame(frame); else {clearInterval(talk);finish(pick);}
  }
  requestAnimationFrame(frame);
}

function finish(i){
  spinning=false; winner=names[i];
  document.getElementById('spin').disabled=false;
  host.classList.remove('talking');
  say('¡Felicidades! Muchas gracias por sus servicios 👋');
  const res=document.getElementById('result'); void res.offsetWidth; res.classList.add('win');
  document.getElementById('resLbl').textContent='★ Seleccionado del premio mayor ★';
  document.getElementById('resName').textContent=winner;
  document.getElementById('resMsg').textContent='¡Muchas gracias por sus servicios!';
  fanfare(); confetti();
  makePhoto(winner).then(b=>{photoBlob=b;
    const img=document.getElementById('preview'); img.src=URL.createObjectURL(b); img.hidden=false;
    document.getElementById('download').disabled=false;});
}

function wrapText(c,text,maxW){const words=text.split(' ');const lines=[];let line='';
  for(const w of words){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;}
  if(line)lines.push(line);return lines;}

function makePhoto(name){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#fff27a');bg.addColorStop(1,'#ffcf33');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  // rayos
  g.save();g.translate(W/2,H*0.62);for(let i=0;i<24;i++){g.rotate(Math.PI/12);g.beginPath();g.moveTo(0,0);g.lineTo(-70,-1200);g.lineTo(70,-1200);g.closePath();g.fillStyle=i%2?'rgba(255,79,163,.10)':'rgba(35,201,176,.10)';g.fill();}g.restore();
  // confeti
  const cols=['#ff4fa3','#23c9b0','#7b4dff','#ff8a1f','#0078BA'];
  for(let i=0;i<70;i++){g.save();g.translate(rand()*W,rand()*H);g.rotate(rand()*6);g.fillStyle=cols[i%5];g.fillRect(-9,-4,18,8);g.restore();}
  // cabecera rosada
  const hg=g.createLinearGradient(0,0,W,0);hg.addColorStop(0,'#ff4fa3');hg.addColorStop(1,'#ff8a1f');
  g.fillStyle=hg;roundRect(g,50,50,W-100,420,34);g.fill();
  g.strokeStyle='#fff';g.lineWidth=8;roundRect(g,50,50,W-100,420,34);g.stroke();
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#fff7b0';g.font='700 38px "Barlow Condensed","Arial Narrow",sans-serif';
  g.fillText('★  GRAN SORTEO · PREMIO MAYOR  ★',W/2,115);
  g.font='84px Bungee, Impact, sans-serif';
  ['¡MUCHAS GRACIAS','POR SUS','SERVICIOS!'].forEach((l,i)=>{const y=215+i*96;g.fillStyle='#7a0d43';g.fillText(l,W/2,y+8);g.fillStyle='#c2186b';g.fillText(l,W/2,y+4);g.fillStyle='#fff';g.fillText(l,W/2,y);});
  if(logoImg&&logoImg.complete&&logoImg.naturalWidth){g.fillStyle='#fff';g.beginPath();g.arc(W-110,110,70,0,7);g.fill();
    const sc=Math.min(104/logoImg.naturalWidth,104/logoImg.naturalHeight);g.drawImage(logoImg,W-110-logoImg.naturalWidth*sc/2,110-logoImg.naturalHeight*sc/2,logoImg.naturalWidth*sc,logoImg.naturalHeight*sc);}
  // cinta
  g.fillStyle='#0078BA';g.fillRect(0,520,W,76);g.fillStyle='#fff';g.font='700 44px "Barlow Condensed","Arial Narrow",sans-serif';
  g.fillText('EL SELECCIONADO ES',W/2,559);
  // nombre
  let fs=100;g.font=`${fs}px Bungee, Impact, sans-serif`;let lines=wrapText(g,name,W-140);
  while((lines.length>2||lines.some(l=>g.measureText(l).width>W-140))&&fs>50){fs-=6;g.font=`${fs}px Bungee, Impact, sans-serif`;lines=wrapText(g,name,W-140);}
  const lh=fs*1.1, y0=720-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>{g.fillStyle='#00507f';g.fillText(l,W/2,y0+i*lh+6);g.fillStyle='#0078BA';g.fillText(l,W/2,y0+i*lh);});
  // anfitriona
  const hb=document.getElementById('hostBust');
  const cx=300,cy=1075,r=190;
  g.fillStyle='#fff';g.beginPath();g.arc(cx,cy,r+14,0,7);g.fill();
  g.strokeStyle='#ff4fa3';g.lineWidth=10;g.beginPath();g.arc(cx,cy,r+14,0,7);g.stroke();
  if(hb.complete&&hb.naturalWidth){g.save();g.beginPath();g.arc(cx,cy,r,0,7);g.clip();g.drawImage(hb,cx-r,cy-r,2*r,2*r);g.restore();}
  // globo
  g.fillStyle='#fff';g.strokeStyle='#2b1233';g.lineWidth=6;roundRect(g,540,900,470,210,30);g.fill();g.stroke();
  g.beginPath();g.moveTo(560,1060);g.lineTo(500,1110);g.lineTo(600,1080);g.closePath();g.fill();g.stroke();
  g.fillStyle='#fff';g.fillRect(556,1050,50,40);
  g.fillStyle='#2b1233';g.font='700 46px "Barlow Condensed","Arial Narrow",sans-serif';
  g.fillText('¡Felicidades!',775,960);g.fillText('Gracias por',775,1015);g.fillText('sus servicios 👋',775,1068);
  const d=new Date().toLocaleDateString('es-PE',{day:'2-digit',month:'long',year:'numeric'});
  g.fillStyle='#6a4a70';g.font='600 36px "Barlow Condensed","Arial Narrow",sans-serif';
  g.fillText(d,775,1200);
  return new Promise((r,j)=>{try{c.toBlob(bl=>bl?r(bl):j(),'image/png');}catch(e){j(e);}});
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function download(){
  if(!photoBlob) return;
  const fname='premio-mayor-'+winner.toLowerCase().replace(/[^a-z0-9ñ]+/gi,'-').replace(/^-|-$/g,'')+'.png';
  const note=document.getElementById('note');
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(photoBlob);a.download=fname;
    document.body.appendChild(a);a.click();a.remove();
    note.textContent='Foto descargada. Si no aparece, mantenga presionada la imagen de abajo y elija "Guardar imagen".';
  }catch(e){note.textContent='Mantenga presionada la imagen de abajo y elija "Guardar imagen".';}
}

const cf=document.getElementById('confetti'),cc=cf.getContext('2d');let parts=[];
function confetti(){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cf.width=innerWidth;cf.height=innerHeight;const cols=['#ff4fa3','#23c9b0','#7b4dff','#ff8a1f','#0078BA','#3DB7E4'];
  for(let i=0;i<200;i++)parts.push({x:innerWidth/2,y:innerHeight*0.35,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:6+Math.random()*6,r:Math.random()*6,c:cols[i%6],life:0});
  requestAnimationFrame(stepC);}
function stepC(){cc.clearRect(0,0,cf.width,cf.height);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.life++;
  cc.save();cc.translate(p.x,p.y);cc.rotate(p.r);cc.fillStyle=p.c;cc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cc.restore();});
  parts=parts.filter(p=>p.y<cf.height+40&&p.life<260);if(parts.length)requestAnimationFrame(stepC);else cc.clearRect(0,0,cf.width,cf.height);}

document.getElementById('spin').addEventListener('click',spin);
document.getElementById('download').addEventListener('click',download);
renderList(); draw();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
</script>
